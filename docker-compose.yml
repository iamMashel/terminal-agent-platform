services:
  api:
    build:
      context: ./apps/api
    environment:
      API_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app

  web:
    build:
      context: ./apps/web
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
