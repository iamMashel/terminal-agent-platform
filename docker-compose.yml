services:
  api:
    build:
      context: ./apps/api
    environment:
      API_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      API_EXECUTION_IMAGE: alpine:3.20
      API_EXECUTION_TIMEOUT_SECONDS: "30"
      API_EXECUTION_MEMORY_LIMIT: 128m
      API_EXECUTION_CPU_QUOTA: "50000"
      API_EXECUTION_CPU_PERIOD: "100000"
      API_EXECUTION_USER: 65534:65534
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build:
      context: ./apps/web
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
